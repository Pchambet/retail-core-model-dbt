version: 2

models:
  - name: stg_pos__sales_lines
    description: >
      POS ticket lines, one row per exported row (re-exports included). Amounts are restated
      without sales tax, the definition of the core model; the tax is kept in its own column.
    columns:
      - name: business_date
        description: The store-local day, taken from the local timestamp of the sale.
        data_tests: [not_null]
      - name: net_amount_usd
        description: Line amount after discount, without sales tax. Negative for a return.
        data_tests: [not_null]
      - name: export_rank
        description: 1 for the latest export of a (ticket_no, line_no), 2 and more for older copies.
        data_tests: [not_null]
  - name: stg_pos__legacy_daily_sales
    description: The legacy daily datamart, unchanged.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [store_code, business_date]

unit_tests:
  - name: latest_export_of_a_pos_line_wins
    description: >
      A ticket line exported on 20 October, then again, corrected, on 21 October: the later export
      ranks first, the one the core model keeps. Amounts are restated without tax.
    model: stg_pos__sales_lines
    given:
      - input: source('us_pos', 'pos_sales_lines')
        rows:
          - {ticket_no: NYC-1, line_no: 1, amount_incl_tax_usd: 108.88, tax_amount_usd: 8.88, export_batch_id: B20261019, loaded_at: "2026-10-20 03:15:00"}
          - {ticket_no: NYC-1, line_no: 1, amount_incl_tax_usd: 97.99, tax_amount_usd: 7.99, export_batch_id: B20261020R, loaded_at: "2026-10-21 03:15:00"}
    expect:
      rows:
        - {export_batch_id: B20261019, net_amount_usd: 100.00, export_rank: 2}
        - {export_batch_id: B20261020R, net_amount_usd: 90.00, export_rank: 1}
