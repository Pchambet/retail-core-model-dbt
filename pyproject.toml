[project]
name = "retail-core-model-dbt"
version = "0.1.0"
description = "dbt work sample: two local US retail platforms migrated to a group core retail model, on synthetic data"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pierre Chambet" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
]

[project.scripts]
generate-data = "retail_core_model_dbt.generate:main"
render-mapping = "retail_core_model_dbt.mapping_doc:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]
snowflake = [
    "dbt-snowflake>=1.12.5",
]

# ruff defaults (version locked in uv.lock) + imports, bugbear, pyupgrade, simplify
[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

# Let Pyright / the editor find the project's .venv (else "import pytest could not be resolved")
[tool.pyright]
venvPath = "."
venv = ".venv"
