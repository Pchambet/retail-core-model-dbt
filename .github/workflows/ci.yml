name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Python checks (generator and mapping page are reproducible)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - run: uv run dbt deps
      - name: Lint SQL
        run: uv run sqlfluff lint models data_tests

      - name: Land the synthetic data
        run: uv run dbt seed
      - name: Build and test (first load)
        run: uv run dbt build --selector transform
      - name: Build and test again (incremental path of the fact)
        run: uv run dbt build --selector transform

      - name: Generate the documentation site
        run: uv run dbt docs generate --static
      - uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: target/static_index.html
