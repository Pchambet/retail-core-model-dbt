selectors:
  - name: transform
    description: >
      Everything after landing: models, data tests and unit tests. The seeds stand in for
      ingestion and are loaded first with `dbt seed` (docs/adr/0002). Excluding the seeds instead
      would also skip the tests that read one (the manifest of planted defects, the mapping).
    definition:
      union:
        - method: resource_type
          value: model
        - method: resource_type
          value: test
        - method: resource_type
          value: unit_test
